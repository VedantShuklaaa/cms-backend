openapi: 3.0.3
info:
  title: CMS Backend API
  version: 0.1.0
  description: |
    College Management System API (Rust, Axum, PostgreSQL).

    All private endpoints require `Authorization: Bearer <token>` from
    `POST /auth/login`. Responses use one of two envelopes:

    * Success: `{ "success": true, "message": "...", "data": ... }`
    * Error: `{ "success": false, "message": "...", "error": "..." }`

    List endpoints are paginated with `page` (default 1) and `per_page`
    (default 20, max 100). DELETEs are soft deactivations and return 200.

    Roles: `ADMIN`, `FACULTY`, `STUDENT`. Service-level ownership rules are
    noted per operation. Validation failures return 422.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Unauthenticated service and database status.
  - name: Auth
    description: Login, logout and the current user's account.
  - name: Departments
    description: Academic departments. Reads are open to all authenticated users; writes are admin only.
  - name: Courses
    description: Courses offered by departments. Reads are open to all authenticated users; writes are admin only.
  - name: Subjects
    description: Subjects, per-user subject lists and faculty assignments.
  - name: Faculty
    description: Faculty profiles linked to user accounts.
  - name: Students
    description: Student profiles linked to user accounts.
  - name: Attendance
    description: Attendance recording, faculty views and student self-service.
  - name: Exams
    description: Exam definitions (admin managed).
  - name: Results
    description: Exam results, scoped by role.
  - name: Notices
    description: Audience-targeted notices with publish and expiry dates.
  - name: Fees
    description: Fee structures, payments and student statements.
  - name: Assignments
    description: Assignments, student submissions and grading.
  - name: Reports
    description: Aggregate admin and faculty reports.

paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database is unreachable; service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password and receive a fresh token
      description: All previously issued tokens are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; includes a new token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /departments:
    get:
      tags: [Departments]
      operationId: listDepartments
      summary: List departments
      description: Any authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated departments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Departments]
      operationId: createDepartment
      summary: Create a department
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /departments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Departments]
      operationId: getDepartment
      summary: Get a department
      description: Any authenticated user.
      responses:
        '200':
          description: Department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Departments]
      operationId: updateDepartment
      summary: Update a department
      description: Admin only. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Departments]
      operationId: deactivateDepartment
      summary: Soft-delete a department
      description: Admin only. Rejected with 409 when active courses reference it.
      responses:
        '200':
          description: Department deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List courses
      description: Any authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a course
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a course
      description: Any authenticated user.
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Courses]
      operationId: updateCourse
      summary: Update a course
      description: Admin only. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Courses]
      operationId: deactivateCourse
      summary: Soft-delete a course
      description: Admin only. Rejected with 409 when active subjects reference it.
      responses:
        '200':
          description: Course deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /subjects:
    get:
      tags: [Subjects]
      operationId: listSubjects
      summary: List subjects
      description: |
        Any authenticated user. Use `faculty_id` to find a faculty member's
        assigned subjects; faculty and students can instead use
        `GET /subjects/mine`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: semester
          in: query
          schema:
            type: integer
        - name: faculty_id
          in: query
          schema:
            type: string
            format: uuid
          description: Only subjects assigned to this faculty member.
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Subjects]
      operationId: createSubject
      summary: Create a subject
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201':
          description: Subject created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /subjects/mine:
    get:
      tags: [Subjects]
      operationId: listMySubjects
      summary: Subjects tied to the signed-in user
      description: |
        Faculty receive the subjects assigned to them. Students receive the
        active subjects in their course for their current semester. Admin
        accounts receive 403.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated subjects for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Subjects]
      operationId: getSubject
      summary: Get a subject
      description: Any authenticated user.
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Subjects]
      operationId: updateSubject
      summary: Update a subject
      description: Admin only. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubjectRequest'
      responses:
        '200':
          description: Subject updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Subjects]
      operationId: deactivateSubject
      summary: Soft-delete a subject
      description: Admin only.
      responses:
        '200':
          description: Subject deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /subjects/{id}/faculty:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Subjects]
      operationId: listSubjectFaculty
      summary: Faculty assigned to a subject
      description: Admin and faculty.
      responses:
        '200':
          description: Assigned faculty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectFacultyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Subjects]
      operationId: assignSubjectFaculty
      summary: Assign a faculty member to a subject
      description: Admin only. Repeating the same assignment is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignFacultyRequest'
      responses:
        '201':
          description: Faculty assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectFacultyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /subjects/{id}/faculty/{faculty_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: faculty_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Subjects]
      operationId: unassignSubjectFaculty
      summary: Remove a faculty assignment
      description: Admin only.
      responses:
        '200':
          description: Assignment removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /faculty:
    get:
      tags: [Faculty]
      operationId: listFaculty
      summary: List faculty
      description: Admin only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated faculty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Faculty]
      operationId: createFaculty
      summary: Create a faculty member and user account
      description: Admin only. Account and profile are created in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFacultyRequest'
      responses:
        '201':
          description: Faculty created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /faculty/me:
    get:
      tags: [Faculty]
      operationId: myFacultyProfile
      summary: Signed-in faculty member's profile
      description: Faculty only.
      responses:
        '200':
          description: Faculty profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /faculty/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Faculty]
      operationId: getFaculty
      summary: Get a faculty member
      description: Admin, or a faculty member viewing their own record.
      responses:
        '200':
          description: Faculty member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Faculty]
      operationId: updateFaculty
      summary: Update a faculty member
      description: Admin only. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacultyRequest'
      responses:
        '200':
          description: Faculty updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Faculty]
      operationId: deactivateFaculty
      summary: Deactivate a faculty member
      description: Admin only. Also deactivates the linked user account.
      responses:
        '200':
          description: Faculty deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students:
    get:
      tags: [Students]
      operationId: listStudents
      summary: List students
      description: Admin and faculty.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
        - name: semester
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Students]
      operationId: createStudent
      summary: Create a student and user account
      description: Admin only. Account and profile are created in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /students/me:
    get:
      tags: [Students]
      operationId: myStudentProfile
      summary: Signed-in student's profile
      description: Student only.
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Students]
      operationId: getStudent
      summary: Get a student
      description: Admin or faculty; a student may fetch only their own record.
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Students]
      operationId: updateStudent
      summary: Update a student
      description: Admin only. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
