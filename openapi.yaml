            type: string
            format: uuid
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Create an assignment
      description: |
        Admin and faculty. Faculty create under their own identity; admins
        must supply `faculty_id`, and that faculty must teach the subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /assignments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: Get an assignment
      description: Any authenticated user with access to the subject/course.
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Assignments]
      operationId: updateAssignment
      summary: Update an assignment
      description: Admin or faculty assigned to the subject. Partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Assignments]
      operationId: deactivateAssignment
      summary: Soft-delete an assignment
      description: Admin or faculty assigned to the subject.
      responses:
        '200':
          description: Assignment deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assignments/{id}/submissions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Assignments]
      operationId: listSubmissions
      summary: List submissions for an assignment
      description: Admin or assigned faculty.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Assignments]
      operationId: submitAssignment
      summary: Submit an assignment
      description: |
        Student only. Re-submitting replaces the content and clears the grade.
        Submission is rejected after the due date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '201':
          description: Assignment submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /assignments/{id}/submissions/{submission_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: submission_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Assignments]
      operationId: gradeSubmission
      summary: Grade a submission
      description: Admin or assigned faculty. Marks must fit the assignment's max_marks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: Submission graded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Assignments]
      operationId: deactivateSubmission
      summary: Soft-delete a submission
      description: Admin or assigned faculty.
      responses:
        '200':
          description: Submission deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/me:
    get:
      tags: [Assignments]
      operationId: mySubmissions
      summary: Signed-in student's submissions
      description: Student only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/overview:
    get:
      tags: [Reports]
      operationId: overviewReport
      summary: Active record counts
      description: Admin only.
      responses:
        '200':
          description: Overview report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/attendance:
    get:
      tags: [Reports]
      operationId: attendanceReport
      summary: Attendance percentages by subject
      description: |
        Admin and faculty (assigned subjects). PRESENT and LATE count as
        attended. Returns an unpaginated array.
      parameters:
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Attendance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /reports/results:
    get:
      tags: [Reports]
      operationId: resultsReport
      summary: Result statistics by exam
      description: |
        Admin and faculty (assigned subjects). Pass rate uses 40% of
        max_marks. Returns an unpaginated array.
      parameters:
        - name: exam_id
          in: query
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/fees:
    get:
      tags: [Reports]
      operationId: feesReport
      summary: Expected, collected and outstanding fees
      description: Admin only. Returns an unpaginated array.
      parameters:
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
        - name: academic_year
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Fees report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int64
        default: 1
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        format: int64
        default: 20
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Case-insensitive partial match. LIKE wildcards are escaped.
    IncludeInactive:
      name: include_inactive
      in: query
      schema:
        type: boolean
        default: false
      description: Admin only; non-admin callers ignore it.

  responses:
    BadRequest:
      description: Malformed JSON, query string or path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or revoked token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Unique constraint or related-record conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Business-rule validation failed (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        error:
          type: string
          example: credits must be between 1 and 10
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              nullable: true
              description: Always null for delete/logout responses.

    Role:
      type: string
      enum: [ADMIN, FACULTY, STUDENT]
    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, EXCUSED]
    ExamType:
      type: string
      enum: [QUIZ, MIDTERM, FINAL, PRACTICAL]
    NoticeAudience:
      type: string
      enum: [ALL, STUDENTS, FACULTY, ADMIN]
    PaymentMethod:
      type: string
      enum: [CASH, CARD, UPI, BANK_TRANSFER]

    HealthData:
      type: object
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        version:
          type: string
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/HealthData'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 512
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    User:
      type: object
      required: [id, email, role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    LoginData:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LoginData'
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/User'

    Department:
      type: object
      required:
        [id, name, code, description, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateDepartmentRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          maxLength: 100
        code:
          type: string
          minLength: 2
          maxLength: 20
        description:
          type: string
          nullable: true
          maxLength: 1000
    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        code:
          type: string
          minLength: 2
          maxLength: 20
        description:
          type: string
          nullable: true
          maxLength: 1000
        is_active:
          type: boolean
    DepartmentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Department'
    PaginatedDepartments:
      type: object
